<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
        <nav>
            <a href="#add a link" class="grey_link">
                <p>About</p>
            </a>
            <a href="#add a link" class="grey_link">
                <p>Store</p>
            </a>
        </nav>
        <section>
            <a href="#add a link" class="white_link">
                <p>Gmail</p>
            </a>
            <a href="#add a link" class="white_link">
                <p>Images</p>
            </a>
            <a href="#add a link" class="white_link">
                <i class="fa-solid fa-flask"></i>
            </a>
            <a href="#add a link" class="white_link">
                <i class="fa-solid fa-list-ul"></i>
            </a>
            <a href="#add a link">
                <img src="public/galaxy.png" alt="user_profile">
            </a>
        </section>
    </header>

    <main>
        <div>
            <h1 class="headerText" id="headerlogo">Google</h1>
        </div>
        <div class="searchBar">
            <div>
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <input type="text" placeholder="Search Google or type a URL">
            <div class="iconButtonsContainer">
                <button class="iconButton"><i class="fa-solid fa-microphone"></i></button>
                <button class="iconButton"><i class="fa-regular fa-camera"></i></button>
            </div>
        </div>

        <div class="searchButton">
            <button>
                <p>Google Search</p>
            </button>
            <button>
                <p>I'm Feeling lucky</p>
            </button>
        </div>

        <div class="languageSelection">
            <p>Google offerd in: <span>Tamil</span></p>
        </div>
        
    </main>

    <footer>
        <section>
            <p>India</p>
        </section>
        <section>
            <div class="footerLinks">
                <a>Advertising</a>
                <a>Business</a>
                <a>How Search Works</a>
            </div>
            <div class="footerLinks">
                <a>Privacy</a>
                <a>Terms</a>
                <a>Settings</a>
            </div>
        </section>


    </footer>
</body>
</html>
